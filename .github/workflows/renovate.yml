name: Renovate

# Self-hosted Renovate workflow for a forked repository.
# The hosted Mend Renovate App skips forks by default, so we run
# Renovate ourselves via GitHub Actions using a PAT stored as
# RENOVATE_TOKEN in this fork's repository secrets.
#
# PREREQUISITE: Set RENOVATE_TOKEN secret in your fork's Settings →
# Secrets → Actions. The token needs `repo` scope (or `contents:write`
# + `pull-requests:write` with fine-grained permissions) and
# `issues:write` for the Dependency Dashboard feature.

on:
    # Run on a weekly schedule (Monday 00:00 UTC = 05:30 IST)
    schedule:
        - cron: '0 0 * * 1'

    # Allow manual runs from the Actions tab
    workflow_dispatch:
        inputs:
            log_level:
                description: 'Renovate log level (debug | info | warn)'
                required: false
                default: 'info'
                type: choice
                options:
                    - info
                    - debug
                    - warn

# Prevent concurrent Renovate runs (they would conflict on the same branches)
concurrency:
    group: renovate
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    renovate:
        name: Run Renovate
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Renovate
              uses: renovatebot/github-action@v46.2.5
              env:
                  # Target only this forked repository (not the upstream)
                  RENOVATE_REPOSITORIES: ${{ github.repository }}

                  # Use the PAT for authentication (GITHUB_TOKEN lacks
                  # permissions to create PRs from Renovate's bot branches)
                  RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}

                  # Respect the config in renovate.json at the repo root
                  RENOVATE_CONFIG_FILE: renovate.json

                  # Log level – defaults to 'info'; overridable via manual trigger
                  LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
