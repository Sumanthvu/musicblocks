name: Renovate

# Self-hosted Renovate workflow for a forked repository.
# The hosted Mend Renovate App skips forks by default, so we run
# Renovate ourselves via GitHub Actions using a PAT stored as
# RENOVATE_TOKEN in this fork's repository secrets.
#
# PREREQUISITE: Set RENOVATE_TOKEN secret in your fork's Settings →
# Secrets → Actions. The token needs `repo` scope (or `contents:write`
# + `pull-requests:write` with fine-grained permissions) and
# `issues:write` for the Dependency Dashboard feature.

on:
    # Run on a weekly schedule.
    # Fires at Sunday 22:00 UTC = Monday 03:30 IST.
    # This gives Renovate a comfortable 2.5-hour window to finish before
    # the renovate.json schedule ("before 6am on monday" Asia/Kolkata) closes.
    # Previously '0 0 * * 1' (Monday 00:00 UTC = 05:30 IST) was too close
    # to the 06:00 IST deadline; GitHub scheduler delays caused silent skips.
    schedule:
        - cron: '0 22 * * 0'

    # Allow manual runs from the Actions tab
    workflow_dispatch:
        inputs:
            log_level:
                description: 'Renovate log level (debug | info | warn)'
                required: false
                default: 'info'
                type: choice
                options:
                    - info
                    - debug
                    - warn

# Prevent concurrent Renovate runs (they would conflict on the same branches)
concurrency:
    group: renovate
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    renovate:
        name: Run Renovate
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Renovate
              uses: renovatebot/github-action@v46.2.5
              env:
                  # Target only this forked repository (not the upstream)
                  RENOVATE_REPOSITORIES: ${{ github.repository }}

                  # Use the PAT for authentication (GITHUB_TOKEN lacks
                  # permissions to create PRs from Renovate's bot branches)
                  RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}

                  # Respect the config in renovate.json at the repo root
                  RENOVATE_CONFIG_FILE: renovate.json

                  # Log level – defaults to 'info'; overridable via manual trigger
                  LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}

                  # CRITICAL: The renovatebot/github-action runs Renovate inside a
                  # Docker container with an isolated npm environment. The 'npmrc'
                  # key in renovate.json is not reliably inherited by npm processes
                  # inside the container during lockfile generation.
                  #
                  # Setting these as environment variables guarantees every npm
                  # process that Renovate spawns (including 'npm install' for
                  # lockfile regeneration) inherits the same settings as the
                  # project's .npmrc file. This prevents corrupted lockfiles where
                  # packages are missing due to unresolved peer dependency conflicts.
                  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
                  NPM_CONFIG_SAVE_EXACT: "true"
                  NPM_CONFIG_PACKAGE_LOCK: "true"
                  NPM_CONFIG_SAVE: "false"
